name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^(docs/.*\.md|README\.md|AGENTS\.md|\.github/pull_request_template\.md)$'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: npm run check
      - if: steps.scope.outputs.code == 'true'
        run: npm run build
      - if: steps.scope.outputs.code == 'false'
        run: echo 'Documentation-only change; application checks intentionally skipped.'
