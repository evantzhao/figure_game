name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: figure_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: figure_chess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U figure_test -d figure_chess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qvE '^(docs/.*\.md|README\.md|AGENTS\.md|\.github/pull_request_template\.md)$'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: '22'
          cache: npm
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: npm run check
        env:
          TEST_DATABASE_URL: postgres://figure_test:disposable-ci-password@127.0.0.1:5432/figure_chess_test
      - if: steps.scope.outputs.code == 'true'
        run: npm run build
      - name: Install browser for focused journeys
        if: steps.scope.outputs.code == 'true'
        run: npx playwright install --with-deps --no-shell chromium
      - name: Verify CPU, mobile layout, and two-player flow
        if: steps.scope.outputs.code == 'true'
        run: npm run test:browser
        env:
          TEST_BROWSER_DATABASE_URL: postgres://figure_test:disposable-ci-password@127.0.0.1:5432/figure_chess_test
      - name: Retain browser evidence
        if: always() && steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - if: steps.scope.outputs.code == 'false'
        run: echo 'Documentation-only change; application checks intentionally skipped.'
